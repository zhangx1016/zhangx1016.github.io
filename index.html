<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人导航</title>
    <style>
        :root {
            --primary-color: #4facfe;
            --secondary-color: #00f2fe;
            --bg-color: #f0f2f5;
            --text-color: #333;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
        }

        .container {
            width: 90%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 { margin-bottom: 30px; font-weight: 300; letter-spacing: 2px; }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
        }

        .nav-item {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-color);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .nav-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            background: var(--primary-color);
            color: white;
        }

        .nav-item .icon {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .nav-item span { font-size: 14px; font-weight: 500; }

        /* 移动端适配 */
        @media (max-width: 480px) {
            .container { padding: 20px; }
            .nav-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>zhangx1016.github.io
</h1>
    <div class="nav-grid" id="navGrid">
        </div>
</div>

<script>
    // 在这里方便地添加或修改您的链接
    const links = [
        { name: '三度计算', url: 'https://zhangx1016.github.io/sd.html', icon: '💻' },
        { name: '批实验报告', url: 'https://zhangx1016.github.io/piyue.html', icon: '💡' },
        { name: '生成实验报告', url: 'https://zhangx1016.github.io/shengcheng.html', icon: '📺' },
        { name: '大五人格测试', url: 'https://zhangx1016.github.io/bigfive.html', icon: '📖' },
        { name: '圣诞树1', url: 'https://zhangx1016.github.io/sds1.html', icon: '🎄' },
        { name: '圣诞树2', url: 'https://zhangx1016.github.io/sds2.html', icon: '🎄' },
        { name: '圣诞树3', url: 'https://zhangx1016.github.io/sds3.html', icon: '🎄' },
        { name: '粒子互动1', url: 'https://zhangx1016.github.io/lz1.html', icon: '💫' },
        { name: '粒子互动1', url: 'https://zhangx1016.github.io/lz2.html', icon: '💫' }
    ];

    const navGrid = document.getElementById('navGrid');

    links.forEach(link => {
        const a = document.createElement('a');
        a.href = link.url;
        a.className = 'nav-item';
        a.target = '_blank';
        a.innerHTML = `
            <div class="icon">${link.icon}</div>
            <span>${link.name}</span>
        `;
        navGrid.appendChild(a);
    });
</script>
<div id="time-elapsed" style="
    position: fixed;
    bottom: 20px;
    right: 20px;
    color: white;
    font-size: 16px;
    font-family: 'PingFang SC', sans-serif;
    text-shadow: 1px 1px 4px rgba(0,0,0,0.5);
    z-index: 1000;
    pointer-events: none;
"></div>

<script>
    function updateElapsed() {
        // 设置目标时间：2025年6月25日 15:30:00
        const targetDate = new Date('2025-06-25T15:30:00');
        const now = new Date();
        
        // 计算时间差（毫秒）
        let diff = now - targetDate;
        
        // 如果当前时间早于目标时间，可以显示为0或负值处理
        if (diff < 0) {
            document.getElementById('time-elapsed').innerText = "尚未到达目标时间";
            return;
        }

        // 计算天、小时、分钟、秒
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        diff -= days * (1000 * 60 * 60 * 24);

        const hours = Math.floor(diff / (1000 * 60 * 60));
        diff -= hours * (1000 * 60 * 60);

        const minutes = Math.floor(diff / (1000 * 60));
        diff -= minutes * (1000 * 60);

        const seconds = Math.floor(diff / 1000);

        // 格式化显示内容
        const displayString = `${days}天${hours}小时${minutes}分${seconds}秒`;
        document.getElementById('time-elapsed').innerText = displayString;
    }

    // 每秒更新一次
    setInterval(updateElapsed, 1000);
    // 页面加载后立即执行一次，避免1秒延迟
    updateElapsed();
</script>
</body>
</html>
